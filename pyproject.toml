[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bikepack-engine"
version = "0.1.0"
description = "Bikepacking Route Processing and Telemetry Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "shapely",
    "pyproj",
    "pmtiles",
    "mapbox-vector-tile",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["engine/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "unit: Pure unit tests with zero external I/O or network dependencies",
    "geo: Geodetic, spherical, and coordinate math tests",
    "tiles: Slippy tile and Web Mercator calculation tests",
    "spatial: Bounding box and spatial indexing tests",
    "units: Metric/imperial and elevation grade conversion tests",
    "io: Safe atomic filesystem and JSON reading/writing tests",
]
