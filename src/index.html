<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Bike Packing Navigator | Live Trail Companion</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bike Packing Navigator">
  <meta name="application-name" content="Bike Packing Navigator">
  <meta name="description" content="Offline-capable waypoint, resupply, and elevation tracker for endurance bikepackers.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }
  </script>
  <!-- Google tag (gtag.js) with Maximum User Anonymization -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GDV26JZZFJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    (function() {
      var dnt = typeof navigator !== 'undefined' && (navigator.doNotTrack === '1' || window.doNotTrack === '1');
      var settings = null;
      try {
        var raw = localStorage.getItem('tour_divide_user_settings');
        if (raw) settings = JSON.parse(raw);
      } catch (e) {}

      if (dnt || (settings && settings.anonymousTelemetryEnabled === false)) {
        window['ga-disable-G-GDV26JZZFJ'] = true;
      }

      var anonCid = null;
      try {
        anonCid = localStorage.getItem('bp_anon_cid');
        if (!anonCid) {
          anonCid = 'c.' + Math.random().toString(36).substring(2, 15) + '.' + Date.now().toString(36);
          localStorage.setItem('bp_anon_cid', anonCid);
        }
      } catch (e) {
        anonCid = 'c.' + Math.random().toString(36).substring(2, 15);
      }

      gtag('config', 'G-GDV26JZZFJ', {
        anonymize_ip: true,
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
        restricted_data_processing: true,
        client_storage: 'none',
        client_id: anonCid,
        send_page_view: false
      });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased select-none selection:bg-emerald-500 selection:text-black">
  <app-root></app-root>
</body>
</html>
