<div class="relative h-full w-full min-h-0 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl bg-slate-950 isolate">

  <!-- Top Floating POI Category Filters (Bounded inside map container, stops before zoom buttons) -->
  <app-route-map-poi-filter
    [activeFilter]="activePoiFilter()"
    (filterChange)="setPoiFilter($event)"
  />

  <!-- MapLibre GL Map Canvas (Fills entire container) -->
  <div #mapContainer class="w-full h-full z-0"></div>

  <!-- Floating Map Controls (Bottom Right, safely inside container) -->
  <app-route-map-controls
    [mapStyle]="mapStyle()"
    [totalDistanceKm]="routeService.totalDistanceKm"
    (centerOnRider)="centerOnRider()"
    (fitFullRoute)="fitFullRoute()"
    (toggleMapStyle)="toggleMapStyle()"
  />

  <!-- Bottom-Left Floating HUD: Quick-Action Map Mode / Download Pill + Telemetry Info -->
  <app-route-map-status-pill
    [currentMile]="currentMile()"
    [unit]="unit()"
    [activeMapMode]="activeMapMode()"
    [isVectorCached]="isVectorCached()"
    [isDownloading]="isDownloading()"
    [downloadPercentage]="downloadPercentage()"
    [activeRouteSizeEstimate]="activeRouteSizeEstimate()"
    [isForcedRaster]="settings.mapRenderer() === 'raster'"
    (downloadVector)="downloadActiveRouteVector()"
    (toggleMapMode)="toggleMapMode()"
  />

</div>
