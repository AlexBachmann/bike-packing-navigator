<div class="space-y-4">
  <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
    <h2 class="font-bold text-white text-sm mb-2">Jump to Major Milestone</h2>
    <div class="grid grid-cols-2 gap-2 mt-3">
      @for (m of milestones(); track m.name) {
        <button
          type="button"
          (click)="onMilestoneClick(m.mile)"
          class="p-2 bg-slate-800/80 hover:bg-slate-700 active:bg-emerald-600/30 rounded-lg text-left transition border border-slate-700/60 cursor-pointer"
        >
          <div class="text-xs font-semibold text-white truncate">{{ m.name }}</div>
          <div class="text-[10px] font-mono text-emerald-400">
            @if (unit() === 'miles') {
              Mile {{ m.mile.toFixed(0) }}
            } @else {
              KM {{ (m.mile * 1.60934).toFixed(0) }}
            }
          </div>
        </button>
      }
    </div>
  </div>

  <!-- GPS Geolocation Simulation & Test Tools -->
  <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <h2 class="font-bold text-white text-sm">GPS Geolocation Simulation</h2>
      <span class="text-[10px] font-mono text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/60">Lot fällen / 10 km cutoff</span>
    </div>
    <p class="text-xs text-slate-400 mb-3">
      Quickly simulate GPS coordinates to verify perpendicular return projections (Lot fällen) and off-route warnings (> 10 km).
    </p>
    <div class="grid grid-cols-2 gap-2 text-xs">
      <button
        type="button"
        (click)="onSimulateGps(51.161267, -115.56016)"
        class="p-2.5 bg-slate-800/80 hover:bg-slate-700 active:bg-emerald-600/30 rounded-lg text-left border border-slate-700/60 transition cursor-pointer"
      >
        <div class="font-semibold text-emerald-300">Banff Grand Depart</div>
        <div class="text-[10px] text-slate-400 font-mono">0.0 km off • Mile 0.0</div>
      </button>
      <button
        type="button"
        (click)="onSimulateGps(51.150, -115.510)"
        class="p-2.5 bg-slate-800/80 hover:bg-slate-700 active:bg-emerald-600/30 rounded-lg text-left border border-slate-700/60 transition cursor-pointer"
      >
        <div class="font-semibold text-emerald-300">Near Banff (2.6 km off)</div>
        <div class="text-[10px] text-slate-400 font-mono">&le; 10 km • Projects to Mile 1.0</div>
      </button>
      <button
        type="button"
        (click)="onSimulateGps(46.0038, -112.5347)"
        class="p-2.5 bg-slate-800/80 hover:bg-slate-700 active:bg-emerald-600/30 rounded-lg text-left border border-slate-700/60 transition cursor-pointer"
      >
        <div class="font-semibold text-emerald-300">Butte, MT (0.4 km off)</div>
        <div class="text-[10px] text-slate-400 font-mono">&le; 10 km • Projects to Mile 702</div>
      </button>
      <button
        type="button"
        (click)="onSimulateGps(49.7333, -114.8833)"
        class="p-2.5 bg-rose-950/30 hover:bg-rose-900/40 rounded-lg text-left border border-rose-800/50 transition cursor-pointer"
      >
        <div class="font-semibold text-rose-300">Sparwood Center (17 km off)</div>
        <div class="text-[10px] text-rose-400 font-mono">&gt; 10 km Alert • Position Kept</div>
      </button>
    </div>
  </div>
</div>
