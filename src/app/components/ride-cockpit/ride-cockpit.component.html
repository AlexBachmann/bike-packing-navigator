<div class="ride-cockpit-container relative w-full h-full flex flex-col overflow-hidden bg-slate-950 select-none">

  <!-- 3D MapLibre Canvas Container -->
  <div class="relative flex-1 w-full min-h-0">
    <div
      #mapContainer
      data-testid="maplibre-3d-canvas"
      class="maplibre-3d-canvas absolute inset-0 w-full h-full"
    ></div>
  </div>

  <!-- Top HUD: Turn-Ahead Guidance & Off-Course Alerts -->
  <div class="hud-top-bar absolute top-3 inset-x-3 pointer-events-none flex flex-col items-center gap-2 z-20">
    <app-ride-turn-guidance-banner [turnCue]="turnCue()" />
    <app-ride-off-course-banner
      [offCourseStatus]="offCourseStatus()"
      [relativeReturnAngle]="relativeReturnAngle()"
    />
  </div>

  <!-- Recenter Camera Button (Visible when auto-follow is suspended after manual pan) -->
  @if (!autoFollow()) {
    <button
      type="button"
      (click)="recenterCamera()"
      class="recenter-button absolute bottom-24 right-4 z-30 flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-emerald-400 border border-emerald-500/40 shadow-xl backdrop-blur-md text-xs font-semibold active:scale-95 transition cursor-pointer"
      aria-label="Recenter map on rider"
    >
      <span>🎯</span>
      <span>Recenter</span>
    </button>
  }

  <!-- Bottom Floating Telemetry Bar: Speedometer (Right) & Climb Mini Profile (Center) -->
  <div class="hud-bottom-bar absolute bottom-4 inset-x-3 pointer-events-none flex items-end justify-between gap-2 z-20">
    <!-- Left Spacer to balance speedometer and keep climb widget centered -->
    <div class="w-16 hidden sm:block shrink-0 pointer-events-none"></div>

    <!-- Climb Mini-Depiction Widget (Center) -->
    <app-ride-climb-mini-widget [climbStatus]="climbStatus()" />

    <!-- Speedometer Telemetry Widget & Simulator Modal (Right) -->
    <div class="relative pointer-events-auto shrink-0 flex flex-col items-end">
      <app-ride-simulator-modal
        [isOpen]="isSimulatorOpen()"
        [isRunning]="gpsSimulator.running()"
        [speed]="simSpeedInput()"
        position="bottom"
        (toggleOpen)="toggleSimulatorModal()"
        (speedChange)="onSimSpeedChange($event)"
        (togglePlay)="toggleSimulation()"
        (reset)="resetSimulation()"
      />

      <app-ride-speedometer
        [speedValue]="displaySpeedValue()"
        [speedUnit]="displaySpeedUnit()"
        [speedText]="displaySpeedText()"
        [isSimulating]="gpsSimulator.running()"
        (toggleSimulator)="toggleSimulatorModal()"
      />
    </div>
  </div>

  <!-- GPS Disabled Warning Card (Floating in Top Half of Cockpit) -->
  @if (isGpsOff() && isVectorCached()) {
    <div
      data-testid="gps-disabled-warning-card"
      class="absolute top-4 left-4 right-4 z-30 max-w-md mx-auto bg-amber-950/90 border border-amber-500/80 rounded-2xl p-3.5 shadow-2xl backdrop-blur-md flex items-center justify-between gap-3 text-amber-100 animate-fade-in"
    >
      <div class="flex items-center gap-3 min-w-0">
        <span class="text-2xl shrink-0">📡</span>
        <div class="min-w-0">
          <div class="font-bold text-xs uppercase tracking-wider text-amber-400">GPS Disabled</div>
          <div class="text-xs text-amber-200/90 truncate">
            {{ gpsState()?.error || 'Ride mode requires active GPS for live navigation.' }}
          </div>
        </div>
      </div>
      <button
        type="button"
        data-testid="enable-gps-btn"
        (click)="enableGps.emit()"
        class="px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow-md transition shrink-0 cursor-pointer active:scale-95"
      >
        Enable GPS
      </button>
    </div>
  }

  <!-- Missing Vector Map (.pmtiles) Gating Overlay Card -->
  @if (!isVectorCached() && !isCheckingCache()) {
    <app-ride-vector-download-card
      [routeTitle]="routeTitle()"
      [estimatedSize]="estimatedSize()"
      [isDownloading]="isDownloading()"
      [downloadPercentage]="downloadPercentage()"
      [downloadError]="downloadError()"
      (download)="downloadVectorMap()"
    />
  }

</div>
