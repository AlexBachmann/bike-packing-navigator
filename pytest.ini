[pytest]
minversion = 7.0
testpaths = engine/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --strict-markers
markers =
    unit: Pure unit tests
    geo: Geodetic and coordinate math tests
    tiles: Slippy tile calculation tests
    spatial: Bounding box and spatial indexing tests
    units: Unit conversion tests
    io: Safe atomic filesystem tests
